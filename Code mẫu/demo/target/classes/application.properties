spring.application.name=demo
server.port=9999
#cau hinh context path, neu cau hinh nhu duoi thi can vao localhost:9999/nguyenvietdung/...
#server.servlet.context-path=/nguyenvietdung 

#Cau hinh jdbc connection
spring.datasource.username=root
spring.datasource.password=
spring.datasource.url=jdbc:mysql://localhost:3306/demo

#cau hinh jpa
#goi ham hibernat su dung cau lenh sql, chuyen cau lenh h�m sang sql native
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
#che do tu gen bang, de false thi khong tu gen, neu co nhung bang, cot chua co trong db thi no tao them
spring.jpa.generate-ddl=true
#khi chay show sql len man hinh console xem cau lenh co dung khong
spring.jpa.show-sql=true

#cau hinh log level de in thong tin ra file luu lai: interface slf4j, thu vien logback
#level default, debug,... sau goi ham tuong ung voi level la default, debug
#debug thi in ra man hinh rat nhieu va chi tiet
logging.level.root = info
logging.file.name=myapp.log
logging.logback.rollingpolicy.max-file-size=2MB
logging.logback.rollingpolicy.max-history=7

#Cau hinh tang dung luong file
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB